name: Docker Image CI

on:
  push:
    branches: [ "dev_new" ]
  pull_request:
    branches: [ "dev_new" ]
  workflow_dispatch:  # 允许手动触发 workflow

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # 设置 QEMU 模拟器以支持跨平台构建
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    # 设置 Buildx 并创建多平台构建器
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver: docker-container
        platforms: linux/amd64,linux/arm64

    # 登录到 GitHub 容器注册表
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # 构建并推送多平台镜像
    - name: Build and push multi-platform Docker image
      id: docker_build
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ghcr.io/luowei729/vb:latest
          ghcr.io/luowei729/vb:${{ github.sha }}
        cache-from: type=registry,ref=ghcr.io/luowei729/vb:cache
        cache-to: type=registry,ref=ghcr.io/luowei729/vb:cache,mode=max
