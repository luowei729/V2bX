name: Docker Image CI

on:
  push:
    branches: [ "dev_new" ]
  pull_request:
    branches: [ "dev_new" ]
  workflow_dispatch:  # 允许手动触发 workflow

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      id: docker_build
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        push: true
        tags: |
          ghcr.io/luowei729/vb:latest
          ghcr.io/luowei729/vb:${{ github.sha }}
        cache-from: type=registry,ref=ghcr.io/luowei729/vb:cache
        cache-to: type=registry,ref=ghcr.io/luowei729/vb:cache,mode=max
