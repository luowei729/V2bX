name: Build & Deploy to MicroK8s

on:
  push:
    branches: [ "dev_new" ]
  workflow_dispatch:

jobs:

  # 🏗️ 1. 构建阶段
  build:
    name: 🏗️ Build Image
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3


  # 📦 2. 推送阶段
  push:
    name: 📦 Build & Push Image
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 登录 GHCR
    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # 登录 DockerHub
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 构建 + 推送
    - name: Build and push multi-platform image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ghcr.io/luowei729/vb:latest
          ghcr.io/luowei729/vb:${{ github.sha }}
          liukezhou/vb:latest
          liukezhou/vb:${{ github.sha }}
        cache-from: type=registry,ref=ghcr.io/luowei729/vb:cache
        cache-to: type=registry,ref=ghcr.io/luowei729/vb:cache,mode=max


  # 🚀 3. 部署阶段
  deploy:
    name: 🚀 Deploy to MicroK8s
    needs: push
    runs-on: ubuntu-latest

    steps:
    - name: Setup kubeconfig
      run: |
        mkdir -p ~/.kube
        cat <<EOF > ~/.kube/config
        ${{ secrets.KUBE_CONFIG }}
        EOF

    - name: Deploy to MicroK8s
      run: |
        kubectl set image daemonset/vb \
        vb=ghcr.io/luowei729/vb:${{ github.sha }}

        kubectl rollout status daemonset/vb
